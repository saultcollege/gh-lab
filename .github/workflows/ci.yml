name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Entry point is executable in the index
        run: |
          mode=$(git ls-files -s gh-lab | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "gh-lab must be mode 100755 in git, found $mode" >&2
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  extension:
    name: Extension smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the floor declared in pyproject.toml and the shim;
        # the upper bound is the version used for development.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the extension from this checkout
        run: gh extension install .

      - name: gh lab --help
        run: |
          output=$(gh lab --help)
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -q 'usage: gh lab'; then
            echo "help output did not use the 'gh lab' program name" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q 'setup-check'; then
            echo "help output did not list setup-check" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q 'admin'; then
            echo "help output did not list the admin group" >&2
            exit 1
          fi

      - name: gh lab --version
        run: |
          output=$(gh lab --version)
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -q '^gh lab '; then
            echo "unexpected version output" >&2
            exit 1
          fi

      - name: Bare invocation prints usage and exits 2
        run: |
          set +e
          output=$(gh lab 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2, got $status" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q 'usage: gh lab'; then
            echo "expected usage on failure" >&2
            exit 1
          fi

      - name: setup-check explains itself outside a lab repository
        run: |
          set +e
          output=$(gh lab setup-check 1 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Traceback'; then
            echo "setup-check raised an unhandled exception" >&2
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2, got $status" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qF '.lab/config.json'; then
            echo "expected the message to name the missing configuration file" >&2
            exit 1
          fi

      # Written with printf rather than a heredoc: a heredoc terminator inside a
      # YAML block scalar depends on how the block is dedented.
      - name: setup-check reports failures cleanly in a lab repository
        run: |
          mkdir -p .lab
          printf '%s' '{"repo-name":"example-lab-1","course-config":"example-org/course-config/26f.json"}' > .lab/config.json
          set +e
          output=$(gh lab setup-check 1 2>&1)
          status=$?
          set -e
          rm -rf .lab
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Traceback'; then
            echo "setup-check raised an unhandled exception" >&2
            exit 1
          fi
          # The branch check compares against 'lab-1' while CI is on the pull
          # request's source branch or main, so this always has something to
          # report and never depends on what gh can see.
          if [ "$status" -ne 1 ]; then
            echo "expected exit status 1, got $status" >&2
            exit 1
          fi

      - name: A command group on its own is a usage error
        run: |
          for argv in "admin" "admin invites"; do
            set +e
            output=$(gh lab $argv 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 2 ]; then
              echo "expected exit status 2 for 'gh lab $argv', got $status" >&2
              exit 1
            fi
            if ! printf '%s\n' "$output" | grep -q 'usage: gh lab'; then
              echo "expected usage for 'gh lab $argv'" >&2
              exit 1
            fi
          done

      - name: admin invites send requires a course configuration
        run: |
          set +e
          output=$(gh lab admin invites send 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2, got $status" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q -- '--config-file'; then
            echo "expected the message to name the missing option" >&2
            exit 1
          fi

      # --config-file names a file in a repository, never a local path, so there
      # is no throwaway file to write here. A reference that cannot resolve is
      # what CI can assert without depending on a real course.
      - name: admin invites send rejects a reference it cannot use
        run: |
          set +e
          output=$(gh lab admin invites send --dry-run --config-file not-a-reference 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Traceback'; then
            echo "send raised an unhandled exception" >&2
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2, got $status" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q -- '--config-file'; then
            echo "expected the message to name what has to be fixed" >&2
            exit 1
          fi

      # example-org/course-config does not exist, which is what the setup-check
      # step above already relies on. A dry run still reads the configuration,
      # so this covers the fetch and its failure, not just argument parsing.
      - name: admin invites send reports an unreachable configuration cleanly
        run: |
          set +e
          output=$(gh lab admin invites send --dry-run --config-file example-org/course-config/26f.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Traceback'; then
            echo "send raised an unhandled exception" >&2
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2, got $status" >&2
            exit 1
          fi

      # The property worth guarding is that it does not block: a prompt nobody
      # can answer would hang the job rather than fail it, so this is run under
      # a timeout with stdin closed. Whether anything is pending depends on the
      # token, so 0 (nothing waiting) and 2 (waiting, but no terminal) are both
      # correct; 124 means it blocked.
      - name: admin invites accept does not block without a terminal
        run: |
          set +e
          output=$(timeout 60 gh lab admin invites accept < /dev/null 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 124 ]; then
            echo "accept blocked waiting for input that cannot arrive" >&2
            exit 1
          fi
          if printf '%s\n' "$output" | grep -q 'Traceback'; then
            echo "accept raised an unhandled exception" >&2
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "expected exit status 0 or 2, got $status" >&2
            exit 1
          fi

      - name: Remove the extension
        run: gh extension remove lab

  platforms:
    # Students run gh lab inside Linux devcontainers, so this is a proof of life
    # rather than a full smoke test: exit codes and usage text are pure Python
    # and already covered above. What is OS-dependent is only whether the shim
    # can resolve its own directory, find an interpreter, and exec the package,
    # which `gh lab --version` exercises end to end.
    name: Install check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The default shell on Windows runners is PowerShell; the shim and these
        # steps are bash.
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the extension from this checkout
        run: gh extension install .

      - name: gh lab runs
        run: |
          gh lab --version
          gh lab --help
